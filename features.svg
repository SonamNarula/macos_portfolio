<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="SonamOS apps" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif}
      .card{fill:#ffffff;stroke:#e3e6ef}
      @media (prefers-color-scheme: dark){.card{fill:#161a2b;stroke:#2a3050}.h{fill:#f2f4ff}.s{fill:#9aa3c7}}
      @media (prefers-color-scheme: light){.h{fill:#14172b}.s{fill:#5b6384}}
    </style>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ac8fa"/><stop offset="1" stop-color="#1e6bff"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fa8ff"/><stop offset="1" stop-color="#1f3bd1"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff375f"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d2a35f"/><stop offset="1" stop-color="#8f6a30"/></linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3a3c"/><stop offset="1" stop-color="#000"/></linearGradient>
    <linearGradient id="g6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e5e7ef"/><stop offset="1" stop-color="#9aa3b5"/></linearGradient>
  </defs>

  <!-- 6 cards -->
  <g class="t">
    <!-- Finder -->
    <rect class="card" x="10" y="20" width="185" height="260" rx="18"/>
    <rect x="62" y="48" width="80" height="80" rx="20" fill="url(#g1)"/>
    <path d="M80 82 q4 -10 14 -2 M118 82 q-4 -10 -14 -2" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M78 102 q22 18 44 0" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text class="h" x="102" y="162" text-anchor="middle" font-size="17" font-weight="700">Finder</text>
    <text class="s" x="102" y="188" text-anchor="middle" font-size="12.5">Browse projects,</text>
    <text class="s" x="102" y="206" text-anchor="middle" font-size="12.5">about, experience</text>
    <text class="s" x="102" y="224" text-anchor="middle" font-size="12.5">&amp; resume</text>

    <!-- Safari -->
    <rect class="card" x="210" y="20" width="185" height="260" rx="18"/>
    <rect x="262" y="48" width="80" height="80" rx="20" fill="url(#g2)"/>
    <circle cx="302" cy="88" r="28" fill="#fff"/>
    <path d="M318 72 l-8 24 -24 8 8 -24z" fill="#ff453a"/>
    <text class="h" x="302" y="162" text-anchor="middle" font-size="17" font-weight="700">Safari</text>
    <text class="s" x="302" y="188" text-anchor="middle" font-size="12.5">Project showcase with</text>
    <text class="s" x="302" y="206" text-anchor="middle" font-size="12.5">GitHub &amp; live demo</text>
    <text class="s" x="302" y="224" text-anchor="middle" font-size="12.5">links</text>

    <!-- Photos -->
    <rect class="card" x="410" y="20" width="185" height="260" rx="18"/>
    <rect x="462" y="48" width="80" height="80" rx="20" fill="#fff" stroke="#e3e6ef"/>
    <g transform="translate(502 88)">
      <ellipse cx="0" cy="-16" rx="9" ry="16" fill="#ff9f0a" opacity=".85"/>
      <ellipse cx="0" cy="-16" rx="9" ry="16" fill="#ff375f" opacity=".7" transform="rotate(60)"/>
      <ellipse cx="0" cy="-16" rx="9" ry="16" fill="#bf5af2" opacity=".7" transform="rotate(120)"/>
      <ellipse cx="0" cy="-16" rx="9" ry="16" fill="#0a84ff" opacity=".7" transform="rotate(180)"/>
      <ellipse cx="0" cy="-16" rx="9" ry="16" fill="#30d158" opacity=".7" transform="rotate(240)"/>
      <ellipse cx="0" cy="-16" rx="9" ry="16" fill="#ffd60a" opacity=".7" transform="rotate(300)"/>
    </g>
    <text class="h" x="502" y="162" text-anchor="middle" font-size="17" font-weight="700">Photos</text>
    <text class="s" x="502" y="188" text-anchor="middle" font-size="12.5">A personal library of</text>
    <text class="s" x="502" y="206" text-anchor="middle" font-size="12.5">memories &amp; moments</text>

    <!-- Contacts -->
    <rect class="card" x="610" y="20" width="185" height="260" rx="18"/>
    <rect x="662" y="48" width="80" height="80" rx="20" fill="url(#g4)"/>
    <circle cx="702" cy="78" r="12" fill="#f6e3bd"/>
    <path d="M678 114 q24 -30 48 0z" fill="#f6e3bd"/>
    <text class="h" x="702" y="162" text-anchor="middle" font-size="17" font-weight="700">Contacts</text>
    <text class="s" x="702" y="188" text-anchor="middle" font-size="12.5">Email, GitHub, LinkedIn,</text>
    <text class="s" x="702" y="206" text-anchor="middle" font-size="12.5">LeetCode &amp; Codolio</text>

    <!-- Terminal -->
    <rect class="card" x="810" y="20" width="185" height="260" rx="18"/>
    <rect x="862" y="48" width="80" height="80" rx="20" fill="url(#g5)"/>
    <text x="876" y="96" font-family="ui-monospace,Menlo,monospace" font-size="26" fill="#fff">&gt;_</text>
    <text class="h" x="902" y="162" text-anchor="middle" font-size="17" font-weight="700">Terminal</text>
    <text class="s" x="902" y="188" text-anchor="middle" font-size="12.5">Run `show tech stack`</text>
    <text class="s" x="902" y="206" text-anchor="middle" font-size="12.5">to see my skills</text>

    <!-- Trash -->
    <rect class="card" x="1010" y="20" width="185" height="260" rx="18"/>
    <rect x="1062" y="48" width="80" height="80" rx="20" fill="url(#g6)"/>
    <path d="M1086 76 h32 l-3 34 q-1 6 -7 6 h-12 q-6 0 -7 -6z" fill="#fff" fill-opacity=".85"/>
    <rect x="1082" y="70" width="40" height="5" rx="2.5" fill="#fff"/>
    <text class="h" x="1102" y="162" text-anchor="middle" font-size="17" font-weight="700">Trash</text>
    <text class="s" x="1102" y="188" text-anchor="middle" font-size="12.5">Because every OS</text>
    <text class="s" x="1102" y="206" text-anchor="middle" font-size="12.5">needs one</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
