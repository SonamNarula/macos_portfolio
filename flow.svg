<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="How SonamOS navigation works" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif}
      .box{fill:#ffffff;stroke:#c9d2f0;stroke-width:1.5}
      .hl{fill:#2f5bff}
      .ln{stroke:#7a8cd8;stroke-width:2;fill:none;stroke-dasharray:6 6;animation:dash 1.2s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-24}}
      @media (prefers-color-scheme: dark){.box{fill:#161a2b;stroke:#2f3763}.tx{fill:#f2f4ff}.sb{fill:#9aa3c7}}
      @media (prefers-color-scheme: light){.tx{fill:#14172b}.sb{fill:#5b6384}}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#7a8cd8"/></marker>
  </defs>
  <g class="t">
    <!-- entry points -->
    <rect class="box" x="20" y="30" width="230" height="80" rx="14"/>
    <text class="tx" x="135" y="66" text-anchor="middle" font-size="16" font-weight="700">Menu bar</text>
    <text class="sb" x="135" y="88" text-anchor="middle" font-size="12.5">Projects · Experience · Contact · Resume</text>

    <rect class="box" x="20" y="140" width="230" height="80" rx="14"/>
    <text class="tx" x="135" y="176" text-anchor="middle" font-size="16" font-weight="700">Desktop folders</text>
    <text class="sb" x="135" y="198" text-anchor="middle" font-size="12.5">CodeFusion · AcornFolio · HireLens</text>

    <rect class="box" x="20" y="250" width="230" height="80" rx="14"/>
    <text class="tx" x="135" y="286" text-anchor="middle" font-size="16" font-weight="700">Dock</text>
    <text class="sb" x="135" y="308" text-anchor="middle" font-size="12.5">Finder · Safari · Photos · Contacts · Terminal</text>

    <!-- window manager -->
    <rect class="hl" x="410" y="110" width="250" height="140" rx="18"/>
    <text x="535" y="165" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Window Manager</text>
    <text x="535" y="192" text-anchor="middle" font-size="12.5" fill="#dbe4ff">open · focus · stack · minimize · maximize</text>
    <text x="535" y="212" text-anchor="middle" font-size="12.5" fill="#dbe4ff">draggable macOS-style windows</text>

    <!-- outputs -->
    <rect class="box" x="820" y="20" width="360" height="62" rx="14"/>
    <text class="tx" x="1000" y="49" text-anchor="middle" font-size="15" font-weight="700">Finder window</text>
    <text class="sb" x="1000" y="68" text-anchor="middle" font-size="12.5">Favourites sidebar · folders · .txt project files</text>

    <rect class="box" x="820" y="98" width="360" height="62" rx="14"/>
    <text class="tx" x="1000" y="127" text-anchor="middle" font-size="15" font-weight="700">Safari window</text>
    <text class="sb" x="1000" y="146" text-anchor="middle" font-size="12.5">Project cards · Explore details · GitHub · Live demo</text>

    <rect class="box" x="820" y="176" width="360" height="62" rx="14"/>
    <text class="tx" x="1000" y="205" text-anchor="middle" font-size="15" font-weight="700">Contact window</text>
    <text class="sb" x="1000" y="224" text-anchor="middle" font-size="12.5">Email copy · GitHub · LinkedIn · LeetCode · Codolio</text>

    <rect class="box" x="820" y="254" width="360" height="62" rx="14"/>
    <text class="tx" x="1000" y="283" text-anchor="middle" font-size="15" font-weight="700">Terminal / Photos / Resume viewer</text>
    <text class="sb" x="1000" y="302" text-anchor="middle" font-size="12.5">Tech stack · photo library · Sonam_Narula_Resume.pdf</text>
  </g>

  <path class="ln" d="M250 70 C 330 70, 340 150, 410 165" marker-end="url(#a)"/>
  <path class="ln" d="M250 180 L 410 180" marker-end="url(#a)"/>
  <path class="ln" d="M250 290 C 330 290, 340 210, 410 195" marker-end="url(#a)"/>
  <path class="ln" d="M660 150 C 740 150, 750 51, 820 51" marker-end="url(#a)"/>
  <path class="ln" d="M660 165 C 740 165, 750 129, 820 129" marker-end="url(#a)"/>
  <path class="ln" d="M660 195 C 740 195, 750 207, 820 207" marker-end="url(#a)"/>
  <path class="ln" d="M660 215 C 740 215, 750 285, 820 285" marker-end="url(#a)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
