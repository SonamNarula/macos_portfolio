<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="SonamOS - macOS themed portfolio" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0f8f"/>
      <stop offset="0.5" stop-color="#3a2bc4"/>
      <stop offset="1" stop-color="#0a1a7a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#8a7cf0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8a7cf0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2d52d8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7da2ff" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif}
      .cursor{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .float{animation:float 5s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    </style>
  </defs>

  <rect width="1200" height="420" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="22" fill="url(#glow)"/>
  <path d="M0 330 C 250 240, 520 330, 760 210 S 1100 120, 1200 60 L1200 420 L0 420 Z" fill="url(#wave)"/>
  <path d="M0 330 C 250 240, 520 330, 760 210 S 1100 120, 1200 60" fill="none" stroke="#bcd0ff" stroke-opacity="0.55" stroke-width="2"/>

  <!-- menu bar -->
  <rect width="1200" height="34" rx="22" fill="#0b0a50" fill-opacity="0.85"/>
  <rect y="18" width="1200" height="16" fill="#0b0a50" fill-opacity="0.85"/>
  <text x="22" y="23" class="t" font-size="15" fill="#fff">⌘</text>
  <text x="52" y="23" class="t" font-size="13" font-weight="700" fill="#fff">SonamOS</text>
  <text x="130" y="23" class="t" font-size="13" fill="#dbe3ff">Projects</text>
  <text x="196" y="23" class="t" font-size="13" fill="#dbe3ff">Experience</text>
  <text x="278" y="23" class="t" font-size="13" fill="#dbe3ff">Contact</text>
  <text x="338" y="23" class="t" font-size="13" fill="#dbe3ff">Resume</text>
  <text x="1178" y="23" text-anchor="end" class="t" font-size="13" fill="#fff">Sat, Nov 21   05:57 PM</text>

  <!-- hero text -->
  <g class="t" text-anchor="middle">
    <text x="600" y="130" font-size="22" fill="#e8ecff">Hello, I'm</text>
    <text x="600" y="215" font-size="84" font-weight="800" fill="#fff" letter-spacing="-2">Sonam Narula<tspan fill="#8fb0ff">.</tspan></text>
    <text x="600" y="262" font-size="28" font-style="italic" fill="#f0f3ff">Think. Solve. Build.<tspan class="cursor" fill="#8fb0ff">|</tspan></text>
    <text x="600" y="300" font-size="15" font-weight="600" letter-spacing="3" fill="#cfd8ff">DSA · COMPETITIVE PROGRAMMING · AI/ML</text>
  </g>

  <!-- badge -->
  <rect x="425" y="318" width="350" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#b8c6ff" stroke-opacity="0.6"/>
  <text x="600" y="340" text-anchor="middle" class="t" font-size="13" font-weight="700" fill="#fff">ICPC ALGO QUEEN 2026 · GLOBAL RANK 386</text>

  <!-- dock -->
  <g class="float" filter="url(#shadow)">
    <rect x="470" y="364" width="260" height="46" rx="14" fill="#ffffff" fill-opacity="0.16" stroke="#fff" stroke-opacity="0.25"/>
    <rect x="482" y="371" width="32" height="32" rx="8" fill="#3b9cff"/>
    <circle cx="545" cy="387" r="15" fill="#fff"/><path d="M552 380 l-5 9 -9 5 5 -9z" fill="#ff4d4d"/>
    <rect x="574" y="371" width="32" height="32" rx="8" fill="#fff"/><circle cx="590" cy="387" r="9" fill="#ff9f1a"/><circle cx="596" cy="383" r="6" fill="#34c759" fill-opacity="0.8"/>
    <rect x="618" y="371" width="32" height="32" rx="8" fill="#b88a4a"/><circle cx="634" cy="384" r="5" fill="#f3d9a8"/><rect x="627" y="391" width="14" height="7" rx="3.5" fill="#f3d9a8"/>
    <rect x="662" y="371" width="32" height="32" rx="8" fill="#111"/><text x="668" y="386" class="t" font-size="11" fill="#fff" font-family="monospace">&gt;_</text>
    <rect x="706" y="373" width="20" height="30" rx="5" fill="#cfd6e6"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
